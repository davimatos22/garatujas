<!DOCTYPE html>
 <html>
    <head>
        <title>Cadastro page</title>
    

    </head>
    <body>
        <form method="get">
            <div>
                <label for="inp-nome">Nome</label>
                <input placeholder="digite seu primeiro nome " type="text" name="nome" id="inp-nome">
            </div>
            <div>
                <label for="inp-sobrenomecompleto">Sobrenome-completo</label>
                <input placeholder="Digite seu sobrenome completo" type="text" name="sobrenomecompleto">
            </div>
            <div>
                <label for="inp-usuário">Usuário</label>
                <input placeholder="Crie o seu nome de Usuário" type="text name="usuário" id="inp-usuário">
            </div>
            <div>
                <label for="ino-senha">Senha</label>
                <input type="password" name="senha" id="inp-nome">
            </div>
            <div>
                <label for="inp-confirmesenha">Confirme a sua senha</label>
                <input type="password" name="confirmesenha">
            </div>
            <button><strong>Cadastre-se</strong></button>
        </form>
    </body>
 </html>
