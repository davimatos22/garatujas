<!DOCTYPE html>
 <html>
    <head>
        <title>Cadastro page</title>
     <style>
            * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
              }  

       body {
          margin: 0%;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;         
          position: relative;
          background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        }


        main {
          display: inline-block;
          width: 40%;
          max-width: 400px;
          border: 2px solid rgb(0, 0, 0);
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
          background: linear-gradient(135deg, #8fa9cc, #6f88b3);
        }

       .campo {
            width: 100%;
            margin-bottom: 1px;
       }

       input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 2px solid rgb(0, 0, 0);
       }

       button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        background: linear-gradient(135deg, #000000, #333333);
        color: white;
        cursor: pointer;
        font-weight: bold;
        margin-top: 15px;
        transition: 0.3s;
        }

       button:hover {
        transform: scale(1.03);
        }
        
     </style>

    </head>
    <body>
        <main>
            <h1>Cadastre-se para continuar.</h1>
            <form method="get">
                <div class="campo">
                <label for="inp-nome"><strong>Nome</strong></label>
                <input placeholder="Digite seu primeiro nome " type="text" name="nome" id="inp-nome">
                </div>
                <div class="campo">
                <label for="inp-sobrenomecompleto"><strong>Sobrenome completo</strong></label>
                <input placeholder="Digite seu sobrenome completo" type="text" name="sobrenomecompleto">
                </div>
                <div class="campo">
                <label for="inp-usuário"><strong>Usuário</strong></label>
                <input placeholder="Crie o seu nome de Usuário" type="text" name="usuário" id="inp-usuário">
                </div>
                <div class="campo">
                <label for="inp-senha"><strong>Senha</strong></label>
                <input placeholder="Crie uma senha" type="password" name="senha" id="inp-senha">
                </div>
                <div class="campo">
                <label for="inp-confirmesenha"><strong>Confirme a sua senha</strong></label>
                <input placeholder="Confirme a sua senha"type="password" name="confirmesenha" id="inp-confirmesenha">
                </div>
                <div class="campo">
                <button>Cadastre-se</button> 
            </div>
            </form>
        </main>
    </body>
 </html>
