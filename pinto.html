<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro page</title>

```
<style>
    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #dbe6f6, #c5796d);
        overflow: hidden;
        position: relative;
    }

    /* Formas decorativas */
    body::before,
    body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(0, 0, 255, 0.1);
        border-radius: 50%;
        z-index: 0;
    }

    body::before {
        top: -50px;
        left: -50px;
    }

    body::after {
        bottom: -50px;
        right: -50px;
    }

    main {
        position: relative;
        z-index: 1;
        width: 40%;
        max-width: 400px;
        border: 3px solid black;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
        background: linear-gradient(135deg, #809dc7, #617ba8);
    }

    h1 {
        margin-bottom: 20px;
    }

    .campo {
        width: 100%;
        margin-bottom: 10px;
    }

    input {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 2px solid black;
    }

    button {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        background-color: black;
        color: white;
        cursor: pointer;
        font-weight: bold;
        margin-top: 15px;
    }

    button:hover {
        background-color: #333;
    }
</style>
```

</head>

<body>
    <main>
        <h1>Cadastre-se para continuar.</h1>

```
    <form method="get">

        <div class="campo">
            <label for="inp-nome"><strong>Nome</strong></label>
            <input placeholder="Digite seu primeiro nome" type="text" name="nome" id="inp-nome">
        </div>

        <div class="campo">
            <label for="inp-sobrenome"><strong>Sobrenome completo</strong></label>
            <input placeholder="Digite seu sobrenome completo" type="text" name="sobrenome" id="inp-sobrenome">
        </div>

        <div class="campo">
            <label for="inp-usuario"><strong>Usuário</strong></label>
            <input placeholder="Crie o seu nome de usuário" type="text" name="usuario" id="inp-usuario">
        </div>

        <div class="campo">
            <label for="inp-senha"><strong>Senha</strong></label>
            <input placeholder="Crie uma senha" type="password" name="senha" id="inp-senha">
        </div>

        <div class="campo">
            <label for="inp-confirmesenha"><strong>Confirme a sua senha</strong></label>
            <input placeholder="Confirme a sua senha" type="password" name="confirmesenha" id="inp-confirmesenha">
        </div>

        <button>Cadastre-se</button>

    </form>
</main>
```

</body>
</html>
